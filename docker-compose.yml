version: '3.8'

services:
  pharmapulse:
    build: .
    container_name: pharmapulse_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./backend/pharmacy.db
      - SECRET_KEY=production_secret_key_change_in_real_deploy
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=*
    volumes:
      # Persistent volume for SQLite database & uploaded prescription files
      - pharmacy_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pharmacy_data:
